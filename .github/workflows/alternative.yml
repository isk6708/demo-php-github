name: Test & Deploy via Git Pull

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Unit tests (fail fast — deployment never runs if this fails)
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🛠️ Marketplace Action: Installs PHP and all your required extensions on Ubuntu
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # You can change this to 8.1, 8.3, etc.
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, zip
          tools: composer:v2

      - name: Verify PHP & SQLite
        shell: bash
        run: |
          php -v
          php -m | grep -E "pdo_sqlite|sqlite3"

      - name: Install Composer Dependencies
        shell: bash
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit Tests
        shell: bash
        run: vendor/bin/phpunit --testdox
