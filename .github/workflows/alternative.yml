name: Test & Deploy via Git Pull

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Unit tests (fail fast — deployment never runs if this fails)
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify PHP & SQLite
        shell: bash
        run: |
          php -v
          php -m | Select-String -Pattern "pdo_sqlite|sqlite3"

      - name: Install Composer Dependencies
        shell: powershell
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit Tests
        shell: powershell
        run: vendor\bin\phpunit --testdox
