name: CI - Test & Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Unit tests (fast feedback)
  test:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/phpunit --testdox

  # 2. Docker smoke test (ensures image can run)
  docker-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        run: docker build -t php-sqlite-crud:test .
      - name: Run container
        run: |
          docker run -d --name app -p 8118:80 php-sqlite-crud:test
          for i in {1..30}; do
            if curl -sf http://localhost:8118/ > /dev/null; then echo "App is up!"; break; fi
            sleep 1
          done
      - name: Verify response
        run: curl -sSf http://localhost:8118/ | grep -q "Product Manager"
      - name: Verify admin dashboard
        run: |
          curl -sSf http://localhost:8118/admin.php > /tmp/admin.html
          grep -q "Admin Dashboard" /tmp/admin.html
          grep -q "Stock Health" /tmp/admin.html
          grep -q "<svg" /tmp/admin.html
      - name: Cleanup
        if: always()
        run: docker rm -f app || true

  # 3. Build and push to GHCR (only on main branch)
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [test, docker-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max